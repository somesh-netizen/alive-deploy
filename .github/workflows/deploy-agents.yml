name: Build, Push & Deploy to Cloudflare

# One-click deployment: automatically build agent images and deploy to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Agent name to deploy (leave empty to auto-detect from git)'
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}

jobs:
  detect-agents:
    name: Detect changed agents
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.detect.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          if [ -n "${{ github.event.inputs.agent_name }}" ]; then
            # Manual input: deploy specific agent
            AGENTS='["${{ github.event.inputs.agent_name }}"]'
          else
            # Auto-detect: find all agent directories with Dockerfile
            AGENTS_LIST=()
            if [ -d "agents" ]; then
              for agent_dir in agents/*/; do
                if [ -f "${agent_dir}Dockerfile" ]; then
                  agent_name=$(basename "$agent_dir")
                  AGENTS_LIST+=("\"$agent_name\"")
                fi
              done
            fi

            if [ ${#AGENTS_LIST[@]} -eq 0 ]; then
              AGENTS='[]'
            else
              AGENTS='['"$(IFS=,; echo "${AGENTS_LIST[*]}")"']'
            fi
          fi
          echo "agents=$AGENTS" >> "$GITHUB_OUTPUT"
          echo "Detected agents: $AGENTS"

  build-push-deploy:
    name: Build & Deploy ${{ matrix.agent }}
    needs: detect-agents
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: ${{ fromJson(needs.detect-agents.outputs.agents) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Validate agent exists
        run: |
          if [ ! -f "agents/${{ matrix.agent }}/Dockerfile" ]; then
            echo "❌ Agent not found: agents/${{ matrix.agent }}/Dockerfile"
            exit 1
          fi
          echo "✅ Found agent: agents/${{ matrix.agent }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ github.repository_owner }}/alive-${{ matrix.agent }}"
          IMAGE_TAG="$(date +%s)"
          echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${IMAGE_NAME,,}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_image=${IMAGE_NAME,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: agents/${{ matrix.agent }}
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ steps.meta.outputs.latest_image }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image_name }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image_name }}:buildcache,mode=max

      - name: Deploy to Cloudflare
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd agents/${{ matrix.agent }}

          # Set up Node.js environment for wrangler
          npm install --no-audit --no-fund

          # Deploy with the built image reference
          npx wrangler deploy \
            --name "alive-${{ matrix.agent }}" \
            --config wrangler.jsonc \
            2>&1 | tee deploy.log

          # Extract the Cloudflare URL from deployment output
          CLOUDFLARE_URL=$(grep -oP 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || echo "")

          if [ -z "$CLOUDFLARE_URL" ]; then
            echo "⚠️  Could not extract URL from deployment"
            echo "Check: https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers"
            CLOUDFLARE_URL="https://dash.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers"
          fi

          echo "cloudflare_url=${CLOUDFLARE_URL}" >> "$GITHUB_OUTPUT"

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 Deployment Successful!

          **Agent:** \`${{ matrix.agent }}\`
          **Image:** \`${{ steps.meta.outputs.full_image }}\`
          **Registry:** GitHub Container Registry (ghcr.io)

          ### Live URL
          🌐 **Public URL:** [\`${{ steps.deploy.outputs.cloudflare_url }}\`](${{ steps.deploy.outputs.cloudflare_url }})

          Anyone can now chat with your agent at the Cloudflare URL! ✨

          ### Image Details
          - **Latest tag:** \`${{ steps.meta.outputs.latest_image }}\`
          - **Timestamp tag:** \`${{ steps.meta.outputs.full_image }}\`
          - **Built with:** docker-buildx in GitHub Actions
          - **No Docker needed locally!** 🎉
          EOF

      - name: Output deployment details
        run: |
          echo "════════════════════════════════════════════════"
          echo "✅ Agent: ${{ matrix.agent }}"
          echo "✅ Image: ${{ steps.meta.outputs.full_image }}"
          echo "✅ Live URL: ${{ steps.deploy.outputs.cloudflare_url }}"
          echo "════════════════════════════════════════════════"
